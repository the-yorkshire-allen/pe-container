version: '3.8'

services:
  pe-primary:
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        PE_VERSION: ${PE_VERSION}
        PE_INSTALLER_TAR_PATH: ${PE_INSTALLER_TAR_PATH}
    
    image: "pe-container:${PE_VERSION}"
    container_name: pe-primary
    privileged: true
    
    # Standard PE service ports
    ports:
      - "8140:8140"  # Puppet Server
      - "9443:443"   # PE Console (HTTPS)
      - "4433:4433"  # PE Classifier
      - "8142:8142"  # PE Orchestrator (PXP)
    
    # Persistence layer: operator-managed volumes
    volumes:
      - pe-config:/etc/puppetlabs
      - pe-data:/opt/puppetlabs
      - pe-logs:/var/log/puppetlabs
      - pe-state:/puppet/state
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      
      # Optional: mount host pe.conf from repo root (first-time setup)
      - ../../pe.conf:/etc/puppetlabs/pe/pe.conf:ro

    tmpfs:
      - /run
      - /run/lock
      - /tmp
    
    # Environment variables
    environment:
      PE_STATE_DIR: /puppet/state
      PE_INSTALLER_STAGING: /puppet/installer-staging
    
    # Restart policy
    restart: unless-stopped
    
    # Resource constraints (adjust for your deployment)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pe-config:
    driver: local
  pe-data:
    driver: local
  pe-logs:
    driver: local
  pe-state:
    driver: local

# Usage:
#   Provide PE_VERSION and PE_INSTALLER_TAR_PATH environment variables or in .env
#   First-time setup: Place pe.conf at ../../pe.conf (relative to this file) or mount via compose override
#   Start: docker-compose up -d --no-build
#   Reset: docker-compose exec pe-primary /puppet/reset-runtime-state.sh && docker-compose restart
#   Logs: docker-compose logs -f pe-primary
