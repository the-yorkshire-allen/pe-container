version: '3.8'

services:
  pe-primary:
    build:
      context: .
      dockerfile: container/Dockerfile
      args:
        PE_VERSION: ${PE_VERSION}
        PE_INSTALLER_TAR_PATH: ${PE_INSTALLER_TAR_PATH}
    
    image: "pe-container:${PE_VERSION}"
    container_name: pe-primary
    
    # Standard PE service ports
    ports:
      - "8140:8140"  # Puppet Server
      - "443:443"    # PE Console
      - "8143:8143"  # PE Console HTTPS
      - "4432:4432"  # PE Classifier
    
    # Persistence layer: operator-managed volumes
    volumes:
      - pe-config:/etc/puppetlabs
      - pe-data:/opt/puppetlabs
      - pe-logs:/var/log/puppetlabs
      - pe-state:/puppet/state
      
      # Optional: mount host  pe.conf (first-time setup)
      # - ./pe.conf:/etc/puppetlabs/pe/pe.conf:ro
    
    # Environment variables
    environment:
      PE_STATE_DIR: /puppet/state
      PE_INSTALLER_STAGING: /puppet/installer-staging
    
    # Restart policy
    restart: unless-stopped
    
    # Resource constraints (adjust for your deployment)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pe-config:
    driver: local
  pe-data:
    driver: local
  pe-logs:
    driver: local
  pe-state:
    driver: local

# Usage:
#   Provide PE_VERSION and PE_INSTALLER_TAR_PATH environment variables or in .env
#   First-time setup: Place pe.conf at ./pe.conf or mount it via docker-compose override
#   Start: docker-compose up -d
#   Reset: docker-compose exec pe-primary /puppet/reset-runtime-state.sh && docker-compose restart
#   Logs: docker-compose logs -f pe-primary
